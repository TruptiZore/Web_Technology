<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fetch Posts</title>
</head>
<body>

    <h2>First 5 Posts</h2>
    <ul id="postList"></ul>

    <script>
        async function fetchPosts() {
            try {
                let response = await fetch("https://jsonplaceholder.typicode.com/posts");
                let posts = await response.json();

                let list = document.getElementById("postList");

                // take only first 5 posts
                posts.slice(0, 5).forEach(post => {
                    let li = document.createElement("li");
                    li.textContent = post.title;
                    list.appendChild(li);
                });

            } catch (error) {
                console.log("Error :", error);
            }
        }

        fetchPosts();
    </script>

</body>
</html>


<!-- 
    Fetch Post ----
        - fetch() is used to get data from an API.
    Example :
            fetch("https://jsonplaceholder.typicode.com/posts")
            .then(res => res.json())
            .then(data => console.log(data));

    What happens -----
        fetch() sends request to server
        res.json() converts response to JavaScript object
        data contains posts
-->
