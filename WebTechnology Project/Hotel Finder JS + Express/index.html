<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Hotel Booking</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <nav class="navbar">
    <a href="/" class="brand">HotelFinder</a>
    <ul class="nav-links">

      <li><a href="/services">Services</a></li>
