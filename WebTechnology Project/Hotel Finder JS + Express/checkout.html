<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="brand">HotelFinder</a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/about">About</a></li>
      <li><a href="/services">Services</a></li>
      <li><a href="/privacy">Privacy</a></li>
      <li><a href="/booking">Booking</a></li>
      <li><button class="theme-toggle" id="themeToggle">🌓</button></li>
    </ul>
  </nav>

  <main class="booking-container">
    <div class="booking-card">
      <h2 id="hotelNameDisplay">Loading Hotel Details...</h2>
      <p id="hotelPriceDisplay"></p>
      
      <form id="bookingForm">
        <label for="userName">Full Name:</label>
        <input type="text" id="userName" placeholder="Trupti Zore" required>

        <label for="checkIn">Check-In Date:</label>
        <input type="date" id="checkIn" required>

        <label for="checkOut">Check-Out Date:</label>
        <input type="date" id="checkOut" required>

        <div class="form-actions">
          <!-- Button type default is submit -->
          <button type="submit" class="confirm-btn">Confirm Booking</button>
          <button type="button" class="back-btn" onclick="window.location.href='/'">Go Back</button>
        </div>
      </form>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
