<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Booking</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Complete Your Booking</h1>
    <div id="clock">Time...</div>
  </header>

  <main class="booking-container">
    <div class="booking-card">
      <h2 id="hotelNameDisplay">Loading Hotel Details...</h2>
      <p id="hotelPriceDisplay"></p>
      
      <form id="bookingForm">
        <label for="userName">Full Name:</label>
        <input type="text" id="userName" placeholder="John Doe" required>

        <label for="checkIn">Check-In Date:</label>
        <input type="date" id="checkIn" required>

        <label for="checkOut">Check-Out Date:</label>
        <input type="date" id="checkOut" required>

        <div class="form-actions">
          <!-- Button type default is submit -->
          <button type="submit" class="confirm-btn">Confirm Booking</button>
          <button type="button" class="back-btn" onclick="window.location.href='index.html'">Go Back</button>
        </div>
      </form>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
