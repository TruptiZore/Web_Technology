<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form validation using DOM</title>

    <style>
        
        /* General Body Styling for Centering */
       body {
            background-color: #dcbcf6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh; /* Changed to 100vh to fill full screen */
            margin: 0;
            font-family: 'Times New Roman', Times, serif;
        }

        /* Header Text Styling */
        h3 {
            color: #0c0c0c;
            margin: 5px 0;
            text-align: center; 
        }
        /* This targets ONLY the first line (Your Name) to push it down */
        h3:first-of-type {
            margin-top: 150px; 
        }

        h1 {
            color: #0d0d0d;
            margin-bottom: 20px;
            text-align: center;
        }
        
        form {
            background-color: white;
            border: 3px solid #ccc; 
            border-radius: 10px;
            padding: 30px;
            width: 450px;
            display: flex;
            flex-direction: column;
            font-size: 18px;
            font-family: 'Times New Roman', Times, serif;
            font-weight: bold;
        }

        /* Input Styling */
        input[type="text"], 
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 3px 0; /* Reduced margin here */
            display: inline-block;
            border: 2px solid #9e9696;
            border-radius: 5px;
            box-sizing: border-box; /* Ensures padding doesn't break width */
            font-size: 17px;
            font-family: 'Times New Roman', Times, serif;
        }

        /* Input Focus Effect */
        input[type="text"]:focus, 
        input[type="password"]:focus {
            border-color: #4CAF50;
            outline: none;
        }

        /* Submit Button Styling */
        input[type="submit"] {
            width: 100%;
            background-color: #217624; 
            color: white;
            padding: 15px;
            margin-top: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        /* Error Message Styling */
        span {
            color: red;
            font-size: 18px;
            margin-top: 3px;
            margin-bottom: 5px;
            display: block;
            height: 10px; /* Reserves space so form doesn't jump */
        }

        /* Success Message Specific Styling */
        #successMsg {
            text-align: center;
            font-size: 20px;
            margin-top: 15px;
            height: auto;
            font-weight: bold;
        }

        span {
            color: red;
        }
    </style>

</head>

<body>
    
    <h3>Trupti Rajgonda Zore. 24UAM316</h3>
    <h3>Experiment 4 : Output</h3>

    <h1>Login Form</h1>

    <form onsubmit="return submitForm()">
        
        Name :
        <input type="text" id="name" placeholder="Enter your name">
        <span id="nameError"></span>
        <br><br>

        Email :
        <input type="text" id="email" placeholder="Enter your email">
        <span id="emailError"></span>
        <br><br>

        Password :
        <input type="password" id="password" placeholder="Enter your password">
        <span id="passwordError"></span>
        <br><br>

        <input type="submit" value="Submit">
        <span id="successMsg"></span>

    </form>

    <script src = 'EXP_04.js'></script>
    
</body>
</html>
